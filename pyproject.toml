[project]
name = "apitest"
version = "0.1.0"
description = "API orchestrator testing framework"
readme = "README.md"
authors = [
    { name = "Fernando Di Bartolo", email = "fernando.di.bartolo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.0",
    "jsonpath-ng>=1.8.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
apitest = "apitest:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]